apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-logging-app
  namespace: logging-demo
  labels:
    app: java-logging-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-logging-app
  template:
    metadata:
      labels:
        app: java-logging-app
    spec:
      containers:
      - name: java-logging-app
        image: java-logging-app:latest
        imagePullPolicy: IfNotPresent
